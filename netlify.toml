[[redirects]]
from = "/sitemap.xml"
to = "https://bggdthmhcanzzuqkztdo.supabase.co/functions/v1/generate-sitemap"
status = 200
force = true

[redirects.headers]
X-From = "netlify"

[[redirects]]
from = "/terms"
to = "/index.html"
status = 200

[[redirects]]
from = "/privacy"
to = "/index.html"
status = 200

[[redirects]]
from = "/subprocessors"
to = "/index.html"
status = 200

[[redirects]]
from = "/pricing"
to = "/index.html"
status = 200

[[redirects]]
from = "/slack"
to = "/index.html"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[build]
command = "npx vite build"
publish = "dist"

[[edge_functions]]
function = "seo-inject"
path = "/reasoning/*"
